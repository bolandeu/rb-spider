[project]
name = "rb-spider"
# Version comes from the git tag vX.Y.Z (uv-dynamic-versioning) — never add `version =`.
dynamic = ["version"]
description = "SEO-краулер для технического аудита сайтов — аналог Screaming Frog SEO Spider"
readme = "README.md"
authors = [{ name = "Roman Bolandau" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "httpx>=0.27",
    "packaging>=24.0",
    "keyring>=25.0",
    "crawlee>=1.10,<1.11",
    "selectolax>=0.4",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "zstandard>=0.23",
    "openpyxl>=3.1",
    "imagesize>=2.0.1",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
# JS rendering (`crawl.render = "always"`): Playwright via Crawlee; the browser itself — `playwright install chromium`
render = ["crawlee[playwright]>=1.10,<1.11"]
# the fallback HTTP client (`crawl.http_client = "curl"`): curl-impersonate via Crawlee
curl = ["crawlee[curl-impersonate]>=1.10,<1.11"]
# near duplicates (`collect.near_duplicates`): MinHash signatures of page text
near = ["datasketch>=2.0"]
# Microdata and RDFa (`collect.structured_data`): extruct; JSON-LD needs nothing extra
structured = ["extruct>=0.18"]
# Custom Extraction by XPath (`custom.extract` with kind = "xpath")
xpath = ["lxml>=5"]
# XML sitemaps (`sitemaps.crawl`, `spider sitemaps`): the sibling package rb-sitemap-xml
sitemaps = ["rb-sitemap-xml>=0.1,<0.2"]
# crawls in PostgreSQL instead of the local SQLite file (`SPIDER_DB_URL`)
postgres = ["psycopg[binary]>=3.2"]
# PageSpeed Insights (`lighthouse.source = "psi"`): the sibling package gsc — it holds the API key (`gsc auth login`)
gsc = ["rb-google-search-console>=0.4,<0.5"]

[project.scripts]
spider = "rb_spider.cli:main"

[project.urls]
Repository = "https://github.com/bolandeu/spider"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.uv]
# Rebuild the editable install when a commit or tag moves, so `--version` follows the tag.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# Sibling packages by release tag (tools/docs/standard-release.md §5); against an unreleased one
# locally: `uv pip install -e ../<package>`, uncommitted
[tool.uv.sources]
rb-sitemap-xml = { git = "https://github.com/bolandeu/sitemap-xml", tag = "v0.1.1" }
rb-google-search-console = { git = "https://github.com/bolandeu/google-search-console", tag = "v0.4.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/rb_spider"]

[tool.hatch.build.targets.wheel.force-include]
# The installed CLI reads [[tool.rb.external]] from here (core/deps.py).
"pyproject.toml" = "rb_spider/_pyproject.toml"

[dependency-groups]
dev = [
    "aiohttp>=3.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "syrupy>=4.8",
    "towncrier>=24.8",
    "trustme>=1.2.1",
    "ty>=0.0.80",
]

# Changelog from fragments: each change adds changelog.d/+<slug>.<type>.md
# (`uv run towncrier create +<slug>.<type>.md -c "..."`); scripts/release.py assembles them.
[tool.towncrier]
filename = "CHANGELOG.md"
directory = "changelog.d"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

# External (non-Python) dependencies — every CLI this tool runs (require_cli,
# shutil.which, subprocess with a literal program, npx). The gate checks this
# list against the code both ways; doctor and require_cli read it at runtime;
# the tools/ root builds docs/external-deps.md from it (standard §12).
# [[tool.rb.external]]
# name = "ffmpeg"
# required = true               # false: the tool works without it (doctor stays healthy)
# min_version = "6.0"           # optional
# check = "ffmpeg -version"     # prints the version; default "<name> --version"
# why = "transcodes the downloaded videos"
# detect = false                # run via an injected runner / absolute path the gate can't see
# dist = "rb-serp"              # for one of our CLIs: its distribution (default rb-<name>)
# url = "https://github.com/bolandeu/serp"  # its repo: DEPENDENCY_TOO_OLD then prints a pinned install

[[tool.rb.external]]
name = "lighthouse"
required = false
detect = false  # run as `lighthouse.command` from settings (core/lighthouse.py), not by a literal name
why = "spider lighthouse --source local (npm install -g lighthouse)"

[[tool.rb.external]]
name = "npx"
required = false
detect = false  # only when lighthouse.command = "npx --yes lighthouse"
why = "spider lighthouse without installing Lighthouse: --set lighthouse.command=\"npx --yes lighthouse\""

[tool.cli-generator]
# Where scripts/check_command_docstrings.py (git pre-commit + Claude Code hooks)
# looks for commands: a glob or a list of globs, relative to the repo root.
commands = ["src/rb_spider/commands/*.py"]
# scripts/release.py: extras to install before ruff/ty/pytest in the gate, and
# the release commit message (e.g. for Conventional Commits hooks).
# gate_extras = ["browser"]
gate_extras = ["render", "curl", "near", "structured", "sitemaps", "xpath", "postgres", "gsc"]
# release_commit = "chore(release): v{version}"

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing:skip-covered"
# tests/test_help.py keeps help snapshots at tests/snapshots/help/<command>.txt
# (standard §7), not in syrupy's own `__snapshots__/<test file>/` layout, so
# syrupy warns it "can not relate" each file to its test. It can — by name.
filterwarnings = ["ignore:(?s).*Can not relate snapshot:UserWarning"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# The template ships at ~94%; keep the bar where it is instead of letting
# new commands land untested. Raise it, never lower it.
fail_under = 90
show_missing = true

[tool.ty.terminal]
# Only errors fail the gate; recent ty (>= 0.0.84) otherwise exits 1 on warnings too.
# Legacy code that can't be fixed yet: downgrade specific rules instead of
# ignoring them, e.g. [tool.ty.rules] possibly-unbound-attribute = "warn".
error-on-warning = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# Help text and docstrings are in Russian: Cyrillic "с"/"а" next to Latin is intended, not a typo.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                # assert is the point of a test
"scripts/*" = ["S603", "S607"]
"bench/*" = ["S311"]              # seeded random for a reproducible fake site, not crypto      # subprocess with fixed argv lists (git, uv), no shell

[tool.ruff.lint.flake8-bugbear]
# Typer's `param: T = typer.Option(...)` style is a call in a default on purpose.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ty.src]
# bench/ is a separate uv project (its own deps, e.g. aiohttp) — not part of the package.
exclude = ["bench"]
